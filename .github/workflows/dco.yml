name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Developer Certificate of Origin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require Signed-off-by on every commit
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha is missing a Signed-off-by line (use git commit -s)."
              missing=1
            fi
          done
          exit $missing
